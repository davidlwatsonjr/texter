name: Deploy to Cloud Run
run-name: Deploy texter from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-texter-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      CLOUD_RUN_SERVICE: texter
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT GCP_ARTIFACT_REPOSITORY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository variable: $name. See DEPLOYMENT.md."
              exit 1
            fi
          done

      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the container on the GitHub runner
        id: build
        shell: bash
        run: |
          set -euo pipefail
          image_base="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/${CLOUD_RUN_SERVICE}"
          image_tag="${image_base}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull --platform linux/amd64 --tag "$image_tag" .
          echo "image_base=$image_base" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Confirm the existing service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format="value(metadata.name)"

      - name: Push the image to Artifact Registry
        id: push
        shell: bash
        env:
          IMAGE_BASE: ${{ steps.build.outputs.image_base }}
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE_TAG"
          image="$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")"
          digest="${image##*@}"
          if [[ "$image" != "$IMAGE_BASE@$digest" || ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not resolve the pushed image digest."
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy the built image to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ steps.push.outputs.image }}
          revision_traffic: LATEST=100

      - name: Verify the deployed service
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image }}
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
          HEALTHCHECK_URL: ${{ vars.CLOUD_RUN_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          url="${HEALTHCHECK_URL:-${SERVICE_URL%/}/ping}"
          if [[ "$url" != https://* ]]; then
            echo "::error::The health-check URL must use HTTPS."
            exit 1
          fi
          response="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 3 "$url")"
          if [[ "$response" != "pong" ]]; then
            echo "::error::The deployed service did not return pong."
            exit 1
          fi
          {
            echo "### Cloud Run deployment"
            echo "- Service: $CLOUD_RUN_SERVICE"
            echo "- Region: $GCP_REGION"
            echo "- Commit: $GITHUB_SHA"
            echo "- Image: $IMAGE_DIGEST"
            echo "- URL: $SERVICE_URL"
            echo "- Health check: passed"
          } >> "$GITHUB_STEP_SUMMARY"
